  <body>
    <script>
      const harihari = [
        "minggu",
        "senin",
        "selasa",
        "rabu",
        "kamis",
        "jumat",
        "sabtu",
      ];
      let hari = new Date().getDay();
      console.log(hari);
      //harihari[2] menggunakan parameter [2] sebagai inisialisasi yg akan digunakan di kondisi
      if ((hari = harihari[2])) {
        hari = "rabu";
      }

      const token = [Math.random() * 1];
      console.log(`tokennya adalah : ${token}`);

      console.log(`ini adalah hari ${hari}`);
    </script>
